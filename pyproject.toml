[project]
name = "nonebot-plugin-custom-news"
version = "0.1.0"
description = "全网热点日报：聚合 B站/微博/新闻/科技/全球热点，渲染为高自定义主题卡片日报图并定时推送，附带 HeroUI WebUI 管理后台"
authors = [{ name = "hszxjs" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["nonebot", "nonebot2", "news", "hot", "daily", "webui"]
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "nonebot-plugin-localstore>=0.7.0",
    "nonebot-plugin-alconna>=0.54.0",
    # >=0.7.1：更早版本（如 0.6.7/0.7.0a3）的 Jinja 环境未开 autoescape，
    # 第三方新闻标题与 LLM 输出会直达被渲染的 Chromium，可执行脚本
    "nonebot-plugin-htmlrender[playwright]>=0.7.1",
    "httpx>=0.27.0",
    "colorthief>=0.2.1",
    "trafilatura>=1.12.0",
    "cryptography>=42.0.0",
    "qrcode>=7.4.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/hszxjs/nonebot-plugin-custom-news"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nonebot_plugin_custom_news*"]

[tool.setuptools.package-data]
nonebot_plugin_custom_news = [
    "templates/*",
    "fonts/*.woff2",
    "assets/backgrounds/*",
    "assets/themes/*",
    "webui/dist/*",
    "webui/dist/assets/*",
]

[tool.nonebot]
plugins = ["nonebot_plugin_custom_news"]

[project.optional-dependencies]
# 开发/回归：pip install -e ".[dev]" 后 python -m pytest
dev = ["pytest>=8.0", "ruff>=0.8", "bandit>=1.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E501",  # 行宽交给 formatter，不重复报
    # B008：FastAPI 的惯例写法就是 Depends()/Header() 作为默认参数（32 处全是这个），
    # 该规则针对的是可变默认值陷阱，不适用于依赖注入
    "B008",
    # E402：NoneBot 插件的惯例是先 require() 再 import（见 __init__.py 的 htmlrender
    # 预配置），此处导入位置是被迫的，不是疏忽
    "E402",
]

[tool.bandit]
exclude_dirs = ["tests", "webui"]
