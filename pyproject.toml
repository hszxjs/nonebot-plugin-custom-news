[project]
name = "nonebot-plugin-custom-news"
version = "0.1.0"
description = "全网热点日报：聚合 B站/微博/新闻/科技/全球热点，渲染为高自定义主题卡片日报图并定时推送，附带 HeroUI WebUI 管理后台"
authors = [{ name = "hszxjs" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["nonebot", "nonebot2", "news", "hot", "daily", "webui"]
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "nonebot-plugin-localstore>=0.7.0",
    "nonebot-plugin-alconna>=0.54.0",
    "nonebot-plugin-htmlrender[playwright]>=0.3.0",
    "httpx>=0.27.0",
    "colorthief>=0.2.1",
    "trafilatura>=1.12.0",
    "cryptography>=42.0.0",
    "qrcode>=7.4.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/hszxjs/nonebot-plugin-custom-news"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nonebot_plugin_custom_news*"]

[tool.setuptools.package-data]
nonebot_plugin_custom_news = [
    "templates/*",
    "fonts/*.woff2",
    "assets/backgrounds/*",
    "assets/themes/*",
    "webui/dist/*",
    "webui/dist/assets/*",
]

[tool.nonebot]
plugins = ["nonebot_plugin_custom_news"]
